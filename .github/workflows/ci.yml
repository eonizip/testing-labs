name: Python CI (pytest)

on:
  push:
    branches: ["main", "ai-version-1", "ai-version-2", "ai-version-3"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:            # ручной запуск из вкладки Actions

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m pytest --verbose --junitxml=test-results.xml

      - name: Publish test results
        if: always()            # сохранять отчёт и при упавших тестах
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.ref_name }}
          path: test-results.xml
